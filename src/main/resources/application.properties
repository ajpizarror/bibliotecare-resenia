spring.application.name=msresenia
spring.config.import=optional:configserver:http://localhost:8097
server.port = 8092
spring.datasource.url=jdbc:mysql://localhost:3306/reseniaam_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

usuario.url=http://localhost:8089
libro.url=http://localhost:8081
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

spring.profiles.active=dev
